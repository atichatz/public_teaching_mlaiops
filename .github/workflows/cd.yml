# ITCS355 Lab 4 — billing-free continuous deployment.
#
# Runs only after successful CI on main. The serving image is pushed to
# GitHub Container Registry with the tested commit SHA, then pulled and
# smoke-tested in a staging container.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-and-smoke-test:
    name: Publish image and smoke-test staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    env:
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE_URI: ghcr.io/${{ github.repository_owner }}/public_teaching_mlaiops-serve:${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install hashed dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Prepare staging model
        run: |
          python scripts/make_dataset.py
          python -m src.train --metrics-out reports/metrics.json
          python scripts/export_model.py --out reports/model.joblib

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push SHA-tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile.serve
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_URI }}

      - name: Pull published image
        run: docker pull "${IMAGE_URI}"

      - name: Start staging container
        run: |
          docker run -d \
            --name lab4-staging \
            -p 8080:8080 \
            -v "$PWD/reports:/app/reports:ro" \
            -e MODEL_PATH=/app/reports/model.joblib \
            -e MODEL_VERSION="${COMMIT_SHA}" \
            "${IMAGE_URI}"

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8080/ready; then
              exit 0
            fi
            sleep 2
          done

          echo "Staging container did not become ready"
          docker logs lab4-staging
          exit 1

      - name: Smoke-test prediction
        run: |
          curl -sf \
            -X POST http://localhost:8080/predict \
            -H "content-type: application/json" \
            -d '{"temp_c":78.4,"vibration_mm_s":3.1,"pressure_kpa":315.2,"hours_since_service":4200,"load_pct":68,"ambient_humidity":55}' \
            | tee reports/lab4-staging-smoke.json

          python -c "
          import json
          from pathlib import Path

          response = json.loads(
              Path('reports/lab4-staging-smoke.json').read_text()
          )

          probability = float(response['probability'])
          version = response['model_version']

          assert 0.0 <= probability <= 1.0, response
          assert version == '${COMMIT_SHA}', response

          print('PASS staging smoke test:', response)
          "

      - name: Save image reference
        run: |
          echo "${IMAGE_URI}" \
            | tee reports/lab4-serving-image-uri.txt

      - name: Show staging logs on failure
        if: failure()
        run: docker logs lab4-staging

      - name: Stop staging container
        if: always()
        run: docker rm -f lab4-staging || true

      - name: Upload staging evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab4-staging-${{ github.event.workflow_run.head_sha }}
          path: |
            reports/lab4-serving-image-uri.txt
            reports/lab4-staging-smoke.json
          if-no-files-found: error
          retention-days: 14
