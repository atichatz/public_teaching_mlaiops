# ITCS355 Lab 4 — continuous deployment.
#
# Runs only for a successful CI workflow on main.
# Google Cloud authentication uses short-lived OIDC credentials.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    name: Deploy to Vertex AI staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: staging

    env:
      CLOUD_PROVIDER: gcp
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      BLOB_URI: ${{ vars.BLOB_URI }}
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
      IDENTITY_REF: ${{ vars.IDENTITY_REF }}
      LAB_NUMBER: "4"
      REPLACE_EXISTING_DEPLOYMENT: "1"
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install hashed dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Build SHA-tagged serving image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f service/Dockerfile.serve \
            -t "itcs355-serve:${COMMIT_SHA}" \
            --load .

      - name: Push serving image
        run: |
          IMAGE_URI="$(
            python -c "
          from src import config
          from cloudlayer.factory import get_adapter

          cfg = config.load()
          adapter = get_adapter(cfg)

          print(
              adapter.push_image(
                  'itcs355-serve:${COMMIT_SHA}'
              )
          )
          " | tail -n 1
          )"

          if [[ "$IMAGE_URI" != *"@sha256:"* ]]; then
            echo "Push did not return a digest-pinned image URI"
            echo "Returned value: $IMAGE_URI"
            exit 1
          fi

          echo "$IMAGE_URI" \
            | tee reports/lab4-serving-image-uri.txt

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Register staging model version
        run: |
          python scripts/register_serving_model.py

      - name: Deploy to staging
        run: |
          python scripts/deploy.py \
            --endpoint "${MODEL_REGISTRY_NAME}-lab4-staging" \
            --instance n1-standard-4

      - name: Smoke test staging
        run: |
          python scripts/smoke.py \
            | tee reports/lab4-staging-smoke.txt

      - name: Save deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: lab4-staging-${{ github.event.workflow_run.head_sha }}
          path: |
            reports/lab4-serving-image-uri.txt
            reports/lab4-serving-model.txt
            reports/lab4-serving-version.txt
            reports/lab4-endpoint.txt
            reports/lab4-staging-smoke.txt
          if-no-files-found: error
          retention-days: 14