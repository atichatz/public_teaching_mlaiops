global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prediction-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - prediction-service:8080

  - job_name: drift-detector
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091
