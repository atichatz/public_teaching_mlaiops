# Lab 4 — service level objectives

service: itcs355-predict

objectives:
  - name: availability
    target: 0.995
    window: 30d
    measurement: "successful responses / total responses, excluding 4xx"
    rationale: "99.5% permits limited maintenance while keeping the prediction service dependable."
    on_budget_exhausted: |
      Freeze new deployments, investigate 5xx errors, and roll back to the
      last known-good SHA-tagged image if the current release caused the failure.

  - name: latency
    target_p95_ms: 200
    window: 7d
    measurement: "p95 of /predict measured at the service endpoint"
    rationale: "The 200 ms target matches the load-test threshold and supports interactive predictions."
    on_budget_exhausted: |
      Stop feature releases, inspect the latency dashboard and container logs,
      then roll back a regressed model version or increase capacity if load is the cause.

  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "days since the production model version was trained"
    rationale: "A monthly review limits stale predictions without retraining on every temporary drift event."
    on_budget_exhausted: |
      Start a validated retraining candidate and compare it with the current model.
      Do not automatically promote it until data quality and behaviour tests pass.
